<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CODE MANIA | Universal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Syncopate:wght@700&display=swap');
        
        :root { --neon-cyan: #00f3ff; --neon-pink: #bc13fe; --neon-green: #00ff41; --bg-dark: #050510; }
        
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background-color: var(--bg-dark); 
            color: white; 
            overflow-x: hidden; 
        }

        /* --- CYBER BACKGROUND --- */
        .cyber-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(188, 19, 254, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            perspective: 500px;
            transform-style: preserve-3d;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove { 0% { transform: translateY(0) rotateX(20deg); } 100% { transform: translateY(50px) rotateX(20deg); } }

        .watermark {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
            font-family: 'Syncopate', sans-serif; font-size: 10vw; font-weight: 900;
            color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, 0.03);
            pointer-events: none; z-index: 0; white-space: nowrap;
        }

        /* --- HOLO CARDS --- */
        .holo-card {
            background: rgba(10, 10, 30, 0.7); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative; z-index: 10;
        }

        /* --- UI ELEMENTS --- */
        .tab-btn { transition: 0.3s all; text-transform: uppercase; letter-spacing: 2px; }
        .tab-btn.active {
            background: linear-gradient(90deg, var(--neon-cyan), #2563eb);
            color: black; box-shadow: 0 0 20px var(--neon-cyan); border: none; font-weight: 800;
        }

        /* --- STUDIO MODAL --- */
        #design-modal { transition: opacity 0.3s ease-in-out; }
        
        .studio-area {
            width: 300px; height: 300px; margin: 0 auto 1rem auto;
            border: 2px dashed var(--neon-cyan); position: relative; overflow: hidden;
            background-image: url('https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=PREVIEW&color=000');
            background-size: contain; background-repeat: no-repeat; background-position: center; background-color: white;
        }
        
        .studio-bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; object-fit: cover; opacity: 0.5; }
        .studio-item { position: absolute; cursor: grab; transform: translate(-50%, -50%); z-index: 20; }
        .studio-item.selected { border: 3px solid var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); }
        .emoji-opt { font-size: 32px; cursor: pointer; text-align: center; padding: 5px; transition: 0.2s; }
        .emoji-opt:hover { scale: 1.2; text-shadow: 0 0 10px white; }

        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(0, 255, 65, 0.7); } 100% { box-shadow: 0 0 0 15px rgba(0, 255, 65, 0); } }
        .mic-active { animation: pulse-green 1.5s infinite; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="cyber-grid"></div>
    <div class="watermark">CODE MANIA</div>

    <div class="w-full max-w-lg space-y-8 z-10 my-8">
        
        <h1 class="text-5xl text-center font-bold tracking-tighter text-transparent bg-clip-text bg-white drop-shadow-[0_0_10px_rgba(0,243,255,0.8)]" style="font-family: 'Syncopate', sans-serif;">
            CODE MANIA
        </h1>

        <div class="holo-card rounded-3xl p-8 transform transition duration-500 hover:shadow-[0_0_60px_rgba(0,243,255,0.2)]">
            

            <form action="/generate" method="POST" enctype="multipart/form-data" id="mainForm">
                <input type="hidden" name="type" id="type-input" value="text">
                <input type="hidden" name="stickers_data" id="stickers_data">
                <input type="hidden" name="background_data" id="background_data">

                <div class="flex gap-3 mb-6 bg-black/40 p-2 rounded-xl border border-white/10 backdrop-blur-sm">
                    <button type="button" onclick="setType('text')" id="tab-text" class="tab-btn active flex-1 py-3 rounded-lg"><i class="fas fa-font"></i> TEXT</button>
                    <button type="button" onclick="setType('file')" id="tab-file" class="tab-btn flex-1 py-3 rounded-lg text-cyan-300"><i class="fas fa-file"></i> FILE</button>
                    <button type="button" onclick="setType('audio')" id="tab-audio" class="tab-btn flex-1 py-3 rounded-lg text-pink-300"><i class="fas fa-microphone"></i> VOICE</button>
                </div>

                <div id="section-text" class="mb-6">
                    <div class="relative group">
                        <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl blur opacity-20 group-hover:opacity-50 transition duration-500"></div>
                        <textarea name="text_content" class="relative w-full bg-[#0a0a1a] border border-white/20 rounded-xl p-4 text-cyan-100 focus:outline-none focus:border-cyan-400 placeholder-white/20 font-mono tracking-wide" rows="4" placeholder="// Enter your text"></textarea>
                    </div>
                </div>

                <div id="section-file" class="hidden mb-6">
                    <div class="border-2 border-dashed border-cyan-500/30 rounded-2xl h-40 flex flex-col items-center justify-center relative hover:bg-cyan-500/10 transition cursor-pointer group">
                        <input type="file" name="file_upload" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                        <i class="fas fa-cloud-upload-alt text-4xl text-cyan-500 mb-3 group-hover:scale-110 transition"></i>
                        <p class="text-xs uppercase tracking-widest text-cyan-300">Drop Datapack Here</p>
                    </div>
                </div>

                <div id="section-audio" class="hidden mb-6 text-center">
                    <div class="relative inline-block">
                        <button type="button" id="mic-btn" onclick="toggleRec()" class="w-24 h-24 rounded-full bg-gradient-to-br from-red-600 to-pink-700 border-4 border-[#0a0a1a] shadow-xl flex items-center justify-center transition active:scale-95 group">
                            <i id="mic-icon" class="fas fa-microphone text-3xl text-white group-hover:text-red-100"></i>
                        </button>
                    </div>
                    <p id="rec-status" class="text-xs text-gray-400 mt-4 font-mono tracking-widest">TAP TO INITIALIZE</p>
                    <input type="file" name="audio_blob" id="audio-file" class="hidden">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-6">
                    <input type="password" name="password" placeholder="Password(Optional)" class="bg-black/30 border border-white/20 rounded-lg p-3 text-sm text-white focus:border-cyan-500 outline-none text-center font-mono">
                    <input type="number" name="max_scans" placeholder="Scanlimit[100]" class="bg-black/30 border border-white/20 rounded-lg p-3 text-sm text-white focus:border-cyan-500 outline-none text-center font-mono">
                </div>

                <button type="button" onclick="openModal()" class="w-full py-3 mb-6 border border-cyan-500/50 rounded-xl text-cyan-400 hover:bg-cyan-500/10 transition uppercase text-xs font-bold tracking-[3px] flex items-center justify-center gap-2 group">
                    <i class="fas fa-palette group-hover:rotate-12 transition"></i> Customize QR <span id="design-tick" class="hidden text-green-400"><i class="fas fa-check"></i></span>
                </button>

                <button type="submit" id="gen-btn" class="w-full bg-gradient-to-r from-cyan-600 via-blue-600 to-purple-600 py-4 rounded-xl font-black text-xl tracking-[5px] uppercase shadow-[0_0_30px_rgba(0,243,255,0.3)] hover:shadow-[0_0_50px_rgba(188,19,254,0.5)] transform hover:-translate-y-1 transition duration-300 relative overflow-hidden">
                    <span class="relative z-10">GENERATE LINK</span>
                    <div class="absolute inset-0 bg-white/20 skew-x-12 -translate-x-full hover:animate-shine"></div>
                </button>
            </form>
        </div>

        <div class="holo-card rounded-2xl p-6 border-l-4 border-l-green-500 transform transition hover:scale-[1.02] hover:shadow-[0_0_30px_rgba(0,255,65,0.2)]">
            <h2 class="text-xl font-bold text-green-400 mb-4 tracking-widest flex items-center">
                <i class="fas fa-download mr-3 animate-bounce"></i> RETRIEVE DATA
            </h2>
            <form action="/retrieve" method="POST" class="flex gap-3">
                <div class="relative flex-1 group">
                    <div class="absolute -inset-0.5 bg-green-500/30 rounded-lg blur opacity-20 group-hover:opacity-50 transition"></div>
                    <input type="text" name="code" placeholder="ENTER ID (e.g. A7X92B)" class="relative w-full bg-black/60 border border-green-500/30 rounded-lg p-3 text-white text-center font-mono tracking-[3px] focus:border-green-500 outline-none uppercase placeholder-gray-600" required>
                </div>
                <button type="submit" class="px-6 py-2 bg-gradient-to-r from-green-600 to-emerald-600 rounded-lg font-bold hover:from-green-500 hover:to-emerald-500 transition shadow-[0_0_15px_rgba(0,255,65,0.4)] text-black tracking-widest">
                    GO
                </button>
            </form>
            {% if error %}
            <p class="text-red-400 text-xs mt-3 text-center font-mono border border-red-500/30 p-2 rounded bg-red-900/20">> ERROR: {{ error }}</p>
            {% endif %}
        </div>

    </div>

    <div id="design-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-md opacity-0 pointer-events-none transition duration-300">
        <div class="bg-[#0f0f1f] border border-cyan-500/50 rounded-2xl w-full max-w-lg p-6 shadow-2xl overflow-y-auto max-h-[95vh] transform scale-95 transition" id="modal-box">
            
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                <h3 class="text-cyan-400 font-bold tracking-widest text-xl">QR ARCHITECT</h3>
                <div id="scan-warning" class="hidden px-3 py-1 bg-red-900 text-red-100 text-xs rounded border border-red-500 animate-pulse font-bold">⚠️ HIGH COVERAGE</div>
            </div>

            <div class="studio-area bg-white rounded-lg" id="canvas">
                <img id="bg-layer" class="hidden absolute inset-0 w-full h-full object-cover opacity-50 z-0 pointer-events-none">
            </div>

            <div class="space-y-6">
                <div class="bg-black/40 p-4 rounded-lg border border-white/5">
                    <div class="flex justify-between mb-2">
                        <p class="text-sm text-gray-300 uppercase font-bold tracking-wider">Add Elements</p>
                        <button onclick="clearBackground()" class="text-xs text-red-400 border border-red-500/50 px-3 py-1 rounded hover:bg-red-900/50 flex items-center gap-1">
                            <i class="fas fa-trash"></i> Reset BG
                        </button>
                    </div>
                    <div class="grid grid-cols-5 gap-3 text-2xl text-center cursor-pointer">
                        <div onclick="addEmoji('😎')">😎</div><div onclick="addEmoji('🔥')">🔥</div><div onclick="addEmoji('❤️')">❤️</div><div onclick="addEmoji('🚀')">🚀</div><div onclick="addEmoji('💀')">💀</div>
                        <div onclick="addEmoji('🎃')">🎃</div><div onclick="addEmoji('👽')">👽</div><div onclick="addEmoji('💩')">💩</div><div onclick="addEmoji('💎')">💎</div><div onclick="addEmoji('👑')">👑</div>
                    </div>
                    <label class="mt-4 block bg-slate-800 border border-slate-600 py-2 text-center rounded cursor-pointer hover:border-cyan-400 text-xs text-cyan-400 font-bold">
                        <i class="fas fa-upload mr-1"></i> Upload Image <input type="file" class="hidden" onchange="uploadSticker(this)">
                    </label>
                </div>

                <div id="edit-controls" class="bg-cyan-900/10 border border-cyan-500/20 p-4 rounded-lg opacity-50 pointer-events-none transition">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm text-cyan-400 font-bold uppercase tracking-wider">Settings</span>
                        <div class="flex gap-2">
                            <button onclick="setAsBackground()" class="text-xs bg-blue-600/50 text-blue-200 px-3 py-1 rounded hover:bg-blue-600 border border-blue-500 font-bold">SET BG</button>
                            <button onclick="deleteSelected()" class="text-xs bg-red-600 text-white px-3 py-1 rounded hover:bg-red-500 font-bold">DEL</button>
                        </div>
                    </div>
                    <div class="flex gap-4">
                        <div class="flex-1"><p class="text-[10px] text-gray-400 uppercase mb-1">Size</p><input type="range" min="20" max="250" value="50" class="w-full accent-cyan-500 h-2 bg-gray-700 rounded-lg cursor-pointer" oninput="updateSize(this.value)"></div>
                        <div class="flex-1"><p class="text-[10px] text-gray-400 uppercase mb-1">Opacity</p><input type="range" min="0.1" max="1" step="0.1" value="1" class="w-full accent-pink-500 h-2 bg-gray-700 rounded-lg cursor-pointer" oninput="updateOpacity(this.value)"></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button type="button" onclick="closeModal()" class="py-3 rounded-lg border border-gray-600 text-gray-400 hover:bg-white/5 font-bold uppercase text-sm">Close</button>
                    <button type="button" onclick="saveDesign()" class="py-3 rounded-lg bg-cyan-600 text-white font-bold uppercase text-sm hover:bg-cyan-500">Confirm Design</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setType(t) {
            document.getElementById('type-input').value = t;
            ['text','file','audio'].forEach(x => {
                document.getElementById('section-'+x).classList.add('hidden');
                document.getElementById('tab-'+x).classList.remove('active');
            });
            document.getElementById('section-'+t).classList.remove('hidden');
            document.getElementById('tab-'+t).classList.add('active');
        }

        // --- AUDIO RECORDER LOGIC (TOGGLE STYLE) ---
        let mediaRec, chunks = [];
        let isRecording = false;
        
        async function toggleRec() {
            if (isRecording) {
                // STOP RECORDING
                if (mediaRec && mediaRec.state !== 'inactive') {
                    mediaRec.stop();
                }
            } else {
                // START RECORDING
                if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                    alert("MIC ERROR: Browser requires HTTPS security."); return;
                }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRec = new MediaRecorder(stream);
                    chunks = [];
                    
                    mediaRec.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
                    
                    mediaRec.onstart = () => {
                        isRecording = true;
                        document.getElementById('mic-btn').classList.add('mic-active');
                        document.getElementById('mic-icon').classList.remove('fa-microphone');
                        document.getElementById('mic-icon').classList.add('fa-stop');
                        document.getElementById('rec-status').innerText = "RECORDING... TAP TO STOP";
                        document.getElementById('rec-status').classList.add('text-red-500');
                        document.getElementById('gen-btn').disabled = true;
                        document.getElementById('gen-btn').classList.add('opacity-50');
                    }

                    mediaRec.onstop = () => {
                        isRecording = false;
                        const f = new File([new Blob(chunks, {type:'audio/webm'})], "voice_note.webm", {type:'audio/webm'});
                        const dt = new DataTransfer(); dt.items.add(f);
                        document.getElementById('audio-file').files = dt.files;
                        
                        document.getElementById('mic-btn').classList.remove('mic-active');
                        document.getElementById('mic-icon').classList.add('fa-microphone');
                        document.getElementById('mic-icon').classList.remove('fa-stop');
                        document.getElementById('rec-status').innerText = "AUDIO READY ✅";
                        document.getElementById('rec-status').className = "text-xs text-green-400 mt-4 font-mono font-bold";
                        document.getElementById('gen-btn').disabled = false;
                        document.getElementById('gen-btn').classList.remove('opacity-50');
                    };

                    mediaRec.start();
                } catch(e) { alert("Mic Permission Denied."); }
            }
        }

        // --- STUDIO LOGIC ---
        const canvas = document.getElementById('canvas');
        let selectedEl = null; let stickerCount = 0; let bgImageSrc = null;

        function openModal() {
            const m = document.getElementById('design-modal');
            const b = document.getElementById('modal-box');
            m.classList.remove('pointer-events-none', 'opacity-0');
            m.classList.add('pointer-events-auto', 'opacity-100');
            b.classList.remove('scale-95'); b.classList.add('scale-100');
        }
        function closeModal() {
            const m = document.getElementById('design-modal');
            const b = document.getElementById('modal-box');
            m.classList.remove('pointer-events-auto', 'opacity-100');
            m.classList.add('pointer-events-none', 'opacity-0');
            b.classList.remove('scale-100'); b.classList.add('scale-95');
        }

        function addEmoji(char) {
            const c = document.createElement('canvas'); c.width = 128; c.height = 128;
            const ctx = c.getContext('2d'); ctx.font = "100px serif"; ctx.fillText(char, 10, 100);
            createStickerElement(c.toDataURL());
        }
        function uploadSticker(input) {
            if(input.files[0]) {
                const r = new FileReader();
                r.onload = e => createStickerElement(e.target.result);
                r.readAsDataURL(input.files[0]);
            }
        }
        function createStickerElement(src) {
            const img = document.createElement('img');
            img.src = src; img.className = 'studio-item w-20'; 
            img.style.left = '50%'; img.style.top = '50%';
            img.dataset.opacity = "1"; img.id = 'stk-'+(stickerCount++);
            img.onmousedown = startDrag; img.ontouchstart = startDrag;
            img.onclick = e => { e.stopPropagation(); selectItem(img); };
            canvas.appendChild(img); selectItem(img); checkCoverage();
        }
        function selectItem(el) {
            if(selectedEl) selectedEl.classList.remove('selected');
            selectedEl = el; el.classList.add('selected');
            document.getElementById('edit-controls').classList.remove('opacity-50', 'pointer-events-none');
        }
        function deleteSelected() {
            if(selectedEl) { selectedEl.remove(); selectedEl = null; 
            document.getElementById('edit-controls').classList.add('opacity-50', 'pointer-events-none'); checkCoverage(); }
        }
        function updateOpacity(v) { if(selectedEl) { selectedEl.style.opacity = v; selectedEl.dataset.opacity = v; } }
        function updateSize(v) { if(selectedEl) { selectedEl.style.width = v+'px'; checkCoverage(); } }
        function setAsBackground() {
            if(selectedEl) {
                bgImageSrc = selectedEl.src;
                document.getElementById('bg-layer').src = bgImageSrc;
                document.getElementById('bg-layer').classList.remove('hidden');
                deleteSelected();
            }
        }
        function clearBackground() {
            bgImageSrc = null;
            document.getElementById('bg-layer').src = "";
            document.getElementById('bg-layer').classList.add('hidden');
        }
        function checkCoverage() {
            let total = 0; const cw = 300; const ch = 300;
            document.querySelectorAll('.studio-item').forEach(el => total += (parseInt(el.style.width)**2));
            const warn = document.getElementById('scan-warning'); const btn = document.getElementById('gen-btn');
            if(total > (cw*ch*0.40)) { warn.classList.remove('hidden'); btn.disabled = true; btn.classList.add('grayscale'); }
            else { warn.classList.add('hidden'); btn.disabled = false; btn.classList.remove('grayscale'); }
        }
        let isDrag=false, startX, startY, initLeft, initTop;
        function startDrag(e) {
            e.preventDefault(); isDrag=true;
            if(selectedEl !== e.target) selectItem(e.target);
            const cx = e.clientX || e.touches[0].clientX; const cy = e.clientY || e.touches[0].clientY;
            startX = cx; startY = cy; initLeft = selectedEl.offsetLeft; initTop = selectedEl.offsetTop;
            document.onmousemove = doDrag; document.ontouchmove = doDrag;
            document.onmouseup = stopDrag; document.ontouchend = stopDrag;
        }
        function doDrag(e) {
            if(!isDrag) return;
            const cx = e.clientX || e.touches[0].clientX; const cy = e.clientY || e.touches[0].clientY;
            selectedEl.style.left = (initLeft + (cx-startX)) + 'px';
            selectedEl.style.top = (initTop + (cy-startY)) + 'px';
        }
        function stopDrag() { isDrag=false; document.onmousemove=null; document.ontouchmove=null; }
        function saveDesign() {
            const arr = []; const cw = 300; const ch = 300;
            document.querySelectorAll('.studio-item').forEach(el => {
                arr.push({ src: el.src, x: (el.offsetLeft+el.offsetWidth/2)/cw, y: (el.offsetTop+el.offsetHeight/2)/ch, size: parseFloat(el.style.width)/cw, opacity: el.dataset.opacity });
            });
            document.getElementById('stickers_data').value = JSON.stringify(arr);
            document.getElementById('background_data').value = bgImageSrc ? JSON.stringify({src:bgImageSrc}) : "";
            document.getElementById('design-tick').classList.remove('hidden');
            closeModal();
        }
    </script>
</body>
</html>
