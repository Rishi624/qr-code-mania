<!DOCTYPE html>
<html lang="en">
<head>
    <title>CODE MANIA | Encrypted</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Syncopate:wght@700&display=swap');
        body { font-family: 'Rajdhani', sans-serif; background-color: #050510; color: white; }
        .holo-card { background: rgba(10, 10, 30, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(0, 243, 255, 0.3); box-shadow: 0 0 50px rgba(0, 243, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="fixed inset-0 z-0 opacity-20" style="background-image: linear-gradient(#00f3ff 1px, transparent 1px), linear-gradient(90deg, #00f3ff 1px, transparent 1px); background-size: 50px 50px; transform: perspective(500px) rotateX(20deg);"></div>

    <div class="holo-card p-6 rounded-3xl relative z-10 w-full max-w-sm flex flex-col items-center">
        
        <div class="mb-4 flex items-center gap-2 text-cyan-400">
            <i class="fas fa-satellite-dish animate-pulse"></i> <span class="tracking-[4px] font-bold text-sm">TRANSMISSION READY</span>
        </div>

        <div class="relative bg-white p-2 rounded-xl mb-4 overflow-hidden shadow-lg">
            <img src="data:image/png;base64,{{ qr_image }}" id="qr-img" class="w-full h-auto max-h-[250px] object-contain rounded-lg">
        </div>

        <div class="w-full mb-4 text-center">
            <p class="text-[10px] text-gray-400 uppercase tracking-widest mb-1">Manual Access Code</p>
            <div class="text-4xl font-mono font-bold text-pink-500 tracking-[5px] drop-shadow-[0_0_10px_rgba(188,19,254,0.8)] select-all cursor-pointer" onclick="copyID('{{ unique_id }}')">
                {{ unique_id }}
            </div>
        </div>

        <div class="flex w-full gap-3">
            <button onclick="shareFile()" class="flex-1 py-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 font-bold tracking-widest uppercase text-[10px] hover:scale-105 transition shadow-lg flex flex-col items-center justify-center gap-1">
                <i class="fab fa-bluetooth text-lg"></i> Bluetooth / Share
            </button>
            <a href="data:image/png;base64,{{ qr_image }}" download="CodeMania_{{ unique_id }}.png" class="flex-1 py-4 rounded-xl border border-cyan-500/50 text-cyan-400 font-bold tracking-widest uppercase text-[10px] hover:bg-cyan-900/20 transition text-center flex flex-col items-center justify-center gap-1">
                <i class="fas fa-download text-lg"></i> Save QR
            </a>
        </div>
    </div>

    <a href="/" class="mt-8 text-cyan-500/50 hover:text-cyan-400 tracking-[5px] uppercase text-xs z-10 transition">
        <i class="fas fa-undo"></i> Reset System
    </a>

    <script>
        // Convert Base64 QR to File Object for Sharing
        function dataURLtoFile(dataurl, filename) {
            var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--){ u8arr[n] = bstr.charCodeAt(n); }
            return new File([u8arr], filename, {type:mime});
        }

        async function shareFile() {
            const qrData = "data:image/png;base64,{{ qr_image }}";
            const file = dataURLtoFile(qrData, 'CodeMania_{{ unique_id }}.png');
            const link = "{{ link }}";
            const id = "{{ unique_id }}";

            // Bluetooth/Native Share Logic
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Code Mania ID: ' + id,
                        text: 'Use Code: ' + id + ' or Scan this.',
                        files: [file],  // This sends the FILE, enabling Bluetooth/AirDrop
                        url: link
                    });
                } catch (e) { console.log('Sharing failed', e); }
            } else {
                alert("Sharing not supported on this browser.");
            }
        }

        function copyID(id) {
            navigator.clipboard.writeText(id);
            alert("ID " + id + " copied!");
        }
    </script>
</body>
</html>
